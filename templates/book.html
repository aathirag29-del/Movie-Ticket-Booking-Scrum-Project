{% extends "base.html" %}{% block title %}Book{% endblock %}{% block content %}<div class="form wide"><h1>{{movie.emoji}} {{movie.title}}</h1><p>{{movie.language}} • {{movie.genre}} • ⭐ {{movie.rating}}</p><form method="post"><label>Cinema</label><select name="cinema">{% for c in cinemas %}<option>{{c}}</option>{% endfor %}</select><label>Show time</label><select name="show_time">{% for t in show_times %}<option>{{t}}</option>{% endfor %}</select><label>Seats (₹180 each)</label><div class="seats">{% for n in range(1,41) %}<label><input type="checkbox" name="seats" value="S{{n}}"><span>S{{n}}</span></label>{% endfor %}</div><p class="muted">Choose 1 to 8 seats.</p><button class="btn full">Continue to Checkout</button></form></div>{% endblock %}
