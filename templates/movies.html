{% extends "base.html" %}{% block title %}Movies{% endblock %}{% block content %}<h1>Movies 🎞️</h1><form class="filters"><input name="q" value="{{q}}" placeholder="Search movie or language"><select name="language"><option>All</option>{% for x in languages %}<option {% if selected_language==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><select name="genre"><option>All</option>{% for x in genres %}<option {% if selected_genre==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select><button class="btn">Search</button></form><div class="grid">{% for m in movies %}<div class="card"><div class="poster">{{m.emoji}}<small>{{m.language}}</small></div><h3>{{m.title}}</h3><p>{{m.genre}} • {{m.duration}} • ⭐ {{m.rating}}</p><a class="btn full" href="/book/{{m.id}}">Book Tickets</a></div>{% else %}<p>No movies found.</p>{% endfor %}</div>{% endblock %}
