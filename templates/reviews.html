{% extends "base.html" %}{% block title %}Reviews{% endblock %}{% block content %}<div class="form wide"><h1>Rate a Movie ⭐</h1><form method="post"><select name="movie_id">{% for m in movies %}<option value="{{m.id}}">{{m.title}} — {{m.language}}</option>{% endfor %}</select><select name="rating"><option value="5">5 - Loved it</option><option value="4">4 - Great</option><option value="3">3 - Good</option><option value="2">2 - Okay</option><option value="1">1 - Not for me</option></select><textarea name="comment" placeholder="Your review"></textarea><button class="btn full">Submit Review</button></form></div>{% endblock %}
