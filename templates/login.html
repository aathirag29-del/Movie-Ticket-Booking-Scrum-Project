{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="form auth-login">
    <h1>Welcome Back</h1>
    <p class="auth-subtitle">Login to continue your movie journey</p>

    <form method="post">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button class="btn login-btn full" type="submit">
            Login
        </button>

    </form>

    <p class="form-link">
        Don't have an account?
        <a class="login-link" href="{{ url_for('register') }}">
            Create Account
        </a>
    </p>
</div>

{% endblock %}
